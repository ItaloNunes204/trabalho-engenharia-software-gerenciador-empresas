services:
    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: gerenciador_empresas
        ports:
            - "5433:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

    backend:
        build:
            context: ..
            dockerfile: docker/Dockerfile
        restart: always
        env_file:
            - ../.env
        ports:
            - "5000:5000"
        depends_on:
            - db

volumes:
    db_data:
